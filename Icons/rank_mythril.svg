<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Mythril: 12-pointed star burst gem — insane complexity -->
  <!-- 12-pt star polygon: outer r=44 at 0°,30°,60°...330° / inner r=26 offset 15° -->
  <!-- Outer pts: (50,6)(72,12)(88,28)(94,50)(88,72)(72,88)(50,94)(28,88)(12,72)(6,50)(12,28)(28,12) -->
  <!-- Inner pts: (57,25)(68,32)(75,43)(75,57)(68,68)(57,75)(43,75)(32,68)(25,57)(25,43)(32,32)(43,25) -->

  <!-- Base star fill (darkest) -->
  <polygon points="50,6 57,25 72,12 68,32 88,28 75,43 94,50 75,57 88,72 68,68 72,88 57,75 50,94 43,75 28,88 32,68 12,72 25,57 6,50 25,43 12,28 32,32 28,12 43,25" fill="#3B0A78"/>

  <!-- 12 spike facets — left and right face of each spike, colored by light angle -->
  <!-- Spike 0: top (50,6) — inner valley pts (43,25) and (57,25), inner ring approx (50,34) -->
  <polygon points="50,6 43,25 50,34" fill="#C084FC"/>
  <polygon points="50,6 57,25 50,34" fill="#9333EA"/>
  <!-- Spike 1: top-right (72,12) -->
  <polygon points="72,12 57,25 63,34" fill="#A855F7"/>
  <polygon points="72,12 68,32 63,34" fill="#7622BA"/>
  <!-- Spike 2: right-upper (88,28) -->
  <polygon points="88,28 68,32 72,42" fill="#9333EA"/>
  <polygon points="88,28 75,43 72,42" fill="#5A1B9E"/>
  <!-- Spike 3: right (94,50) -->
  <polygon points="94,50 75,43 72,50" fill="#7622BA"/>
  <polygon points="94,50 75,57 72,50" fill="#4A1090"/>
  <!-- Spike 4: right-lower (88,72) -->
  <polygon points="88,72 75,57 72,58" fill="#5A1B9E"/>
  <polygon points="88,72 68,68 72,58" fill="#3B0A78"/>
  <!-- Spike 5: bottom-right (72,88) -->
  <polygon points="72,88 68,68 63,66" fill="#4A1090"/>
  <polygon points="72,88 57,75 63,66" fill="#2E0860"/>
  <!-- Spike 6: bottom (50,94) -->
  <polygon points="50,94 57,75 50,66" fill="#3B0A78"/>
  <polygon points="50,94 43,75 50,66" fill="#280660"/>
  <!-- Spike 7: bottom-left (28,88) -->
  <polygon points="28,88 43,75 37,66" fill="#3B0A78"/>
  <polygon points="28,88 32,68 37,66" fill="#4A1090"/>
  <!-- Spike 8: left-lower (12,72) -->
  <polygon points="12,72 32,68 28,58" fill="#4A1090"/>
  <polygon points="12,72 25,57 28,58" fill="#5A1B9E"/>
  <!-- Spike 9: left (6,50) -->
  <polygon points="6,50 25,57 28,50" fill="#5A1B9E"/>
  <polygon points="6,50 25,43 28,50" fill="#7622BA"/>
  <!-- Spike 10: left-upper (12,28) -->
  <polygon points="12,28 25,43 28,42" fill="#7622BA"/>
  <polygon points="12,28 32,32 28,42" fill="#9333EA"/>
  <!-- Spike 11: top-left (28,12) -->
  <polygon points="28,12 32,32 37,34" fill="#A855F7"/>
  <polygon points="28,12 43,25 37,34" fill="#C084FC"/>

  <!-- Inner ring facets connecting the 12 inner valley points — forms inner 12-gon -->
  <!-- Fill the inner ring (between inner valley pts and inner circle r=16) -->
  <!-- Inner ring as a 12-gon polygon -->
  <polygon points="57,25 68,32 75,43 75,57 68,68 57,75 43,75 32,68 25,57 25,43 32,32 43,25" fill="#5A1B9E"/>

  <!-- Inner hex gem (r≈16, 6 pts) — its own step cut facets -->
  <polygon points="50,34 64,42 64,58 50,66 36,58 36,42" fill="#7622BA"/>
  <!-- Inner hex facets -->
  <polygon points="50,34 64,42 57,38" fill="#C084FC" opacity="0.8"/>
  <polygon points="50,34 36,42 43,38" fill="#9333EA" opacity="0.8"/>
  <polygon points="64,42 64,58 62,50" fill="#4A1090" opacity="0.8"/>
  <polygon points="36,42 36,58 38,50" fill="#9333EA" opacity="0.8"/>

  <!-- Center table -->
  <circle cx="50" cy="50" r="9" fill="#A855F7"/>
  <circle cx="50" cy="50" r="6" fill="#C084FC"/>
  <!-- Center specular -->
  <ellipse cx="46" cy="46" rx="4" ry="2.5" fill="white" opacity="0.5"/>

  <!-- Outer sparkle rays from star tips -->
  <line x1="50" y1="6" x2="50" y2="1" stroke="#E9D5FF" stroke-width="2" opacity="0.9"/>
  <line x1="72" y1="12" x2="75" y2="8" stroke="#E9D5FF" stroke-width="1.5" opacity="0.8"/>
  <line x1="88" y1="28" x2="92" y2="24" stroke="#DDD6FE" stroke-width="1.5" opacity="0.7"/>
  <line x1="94" y1="50" x2="99" y2="50" stroke="#E9D5FF" stroke-width="2" opacity="0.9"/>
  <line x1="88" y1="72" x2="92" y2="76" stroke="#DDD6FE" stroke-width="1.5" opacity="0.7"/>
  <line x1="72" y1="88" x2="75" y2="92" stroke="#DDD6FE" stroke-width="1.5" opacity="0.6"/>
  <line x1="50" y1="94" x2="50" y2="99" stroke="#E9D5FF" stroke-width="1.5" opacity="0.7"/>
  <line x1="28" y1="88" x2="25" y2="92" stroke="#DDD6FE" stroke-width="1" opacity="0.6"/>
  <line x1="12" y1="72" x2="8" y2="76" stroke="#DDD6FE" stroke-width="1" opacity="0.5"/>
  <line x1="6" y1="50" x2="1" y2="50" stroke="#E9D5FF" stroke-width="2" opacity="0.8"/>
  <line x1="12" y1="28" x2="8" y2="24" stroke="#DDD6FE" stroke-width="1" opacity="0.6"/>
  <line x1="28" y1="12" x2="25" y2="8" stroke="#E9D5FF" stroke-width="1.5" opacity="0.8"/>

  <!-- Aura glow ring (subtle outer ring suggestion) -->
  <circle cx="50" cy="50" r="47" fill="none" stroke="#9333EA" stroke-width="0.8" opacity="0.3"/>
</svg>
