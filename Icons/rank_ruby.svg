<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Ruby: pear/teardrop cut — 10 border facets + table + inner step + tip fans -->
  <!-- Outer pear: top tip (50,6), then oval body below -->
  <!-- Outer 10 pts: (50,6)(80,28)(90,56)(82,76)(66,90)(50,92)(34,90)(18,76)(10,56)(20,28) -->
  <!-- Inner 10 pts: (50,16)(70,30)(80,52)(74,70)(62,82)(50,84)(38,82)(26,70)(20,52)(30,30) -->
  <!-- 10 trapezoid facets -->
  <polygon points="50,6 80,28 70,30 50,16" fill="#FF7090"/>
  <polygon points="80,28 90,56 80,52 70,30" fill="#F04060"/>
  <polygon points="90,56 82,76 74,70 80,52" fill="#C81838"/>
  <polygon points="82,76 66,90 62,82 74,70" fill="#9A0828"/>
  <polygon points="66,90 50,92 50,84 62,82" fill="#720018"/>
  <polygon points="50,92 34,90 38,82 50,84" fill="#600010"/>
  <polygon points="34,90 18,76 26,70 38,82" fill="#780020"/>
  <polygon points="18,76 10,56 20,52 26,70" fill="#9E0828"/>
  <polygon points="10,56 20,28 30,30 20,52" fill="#C82040"/>
  <polygon points="20,28 50,6 50,16 30,30" fill="#E85070"/>
  <!-- Table pear -->
  <polygon points="50,16 70,30 80,52 74,70 62,82 50,84 38,82 26,70 20,52 30,30" fill="#FF6080"/>
  <!-- Inner step pear -->
  <polygon points="50,24 64,34 72,52 66,68 56,78 50,80 44,78 34,68 28,52 36,34" fill="#FF8098" opacity="0.85"/>
  <!-- Tip fan facets (adds complexity near the pointed top) -->
  <polygon points="50,6 50,16 44,22 36,20" fill="#FF90A8" opacity="0.6"/>
  <polygon points="50,6 50,16 56,22 64,20" fill="#E04060" opacity="0.6"/>
  <!-- Specular -->
  <polygon points="50,16 62,22 56,30 46,28" fill="white" opacity="0.35"/>
</svg>
