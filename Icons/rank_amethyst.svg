<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Amethyst: marquise cut (pointed oval navette) — 8 border facets + table + inner step -->
  <!-- Outer marquise 8 pts: (50,6)(78,20)(92,50)(78,80)(50,94)(22,80)(8,50)(22,20) -->
  <!-- Inner table 8 pts: (50,18)(68,28)(78,50)(68,72)(50,82)(32,72)(22,50)(32,28) -->
  <!-- 8 trapezoid facets around the marquise -->
  <polygon points="50,6 78,20 68,28 50,18" fill="#FFD0E8"/>
  <polygon points="78,20 92,50 78,50 68,28" fill="#F898C8"/>
  <polygon points="92,50 78,80 68,72 78,50" fill="#D84898"/>
  <polygon points="78,80 50,94 50,82 68,72" fill="#9A2860"/>
  <polygon points="50,94 22,80 32,72 50,82" fill="#780048"/>
  <polygon points="22,80 8,50 22,50 32,72" fill="#9A2860"/>
  <polygon points="8,50 22,20 32,28 22,50" fill="#D060A0"/>
  <polygon points="22,20 50,6 50,18 32,28" fill="#F0A8D0"/>
  <!-- Table octagon -->
  <polygon points="50,18 68,28 78,50 68,72 50,82 32,72 22,50 32,28" fill="#F898C8"/>
  <!-- Inner step -->
  <polygon points="50,26 62,34 70,50 62,66 50,74 38,66 30,50 38,34" fill="#FFB8DC" opacity="0.8"/>
  <!-- Inner gem highlight -->
  <polygon points="50,26 56,30 50,36 44,30" fill="white" opacity="0.4"/>
  <ellipse cx="44" cy="24" rx="8" ry="5" fill="white" opacity="0.25"/>
</svg>
