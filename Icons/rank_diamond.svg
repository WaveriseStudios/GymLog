<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Diamond: round brilliant — 8 main kites + 8 star facets + table + sparkle rays -->
  <!-- Girdle base circle -->
  <circle cx="50" cy="50" r="44" fill="#0888A0"/>
  <!-- 8 main kite facets (outer pt to 2 table-ring pts) -->
  <!-- top:      outer(50,6)  → inner(42,31)(58,31) -->
  <polygon points="50,6 42,31 58,31" fill="#E0FCFF"/>
  <!-- top-right: outer(81,19) → inner(58,31)(69,42) -->
  <polygon points="81,19 58,31 69,42" fill="#B0F0FF"/>
  <!-- right:     outer(94,50) → inner(69,42)(69,58) -->
  <polygon points="94,50 69,42 69,58" fill="#55E0F0"/>
  <!-- bottom-right: outer(81,81) → inner(69,58)(58,69) -->
  <polygon points="81,81 69,58 58,69" fill="#18A8C0"/>
  <!-- bottom:   outer(50,94) → inner(58,69)(42,69) -->
  <polygon points="50,94 58,69 42,69" fill="#0870A0"/>
  <!-- bottom-left: outer(19,81) → inner(42,69)(31,58) -->
  <polygon points="19,81 42,69 31,58" fill="#0E7090"/>
  <!-- left:     outer(6,50)  → inner(31,58)(31,42) -->
  <polygon points="6,50 31,58 31,42" fill="#1890A8"/>
  <!-- top-left: outer(19,19) → inner(31,42)(42,31) -->
  <polygon points="19,19 31,42 42,31" fill="#70D8EE"/>
  <!-- 8 star facets (between kites, adjacent outer pts share one inner pt) -->
  <polygon points="50,6 81,19 58,31" fill="#C8F6FF"/>
  <polygon points="81,19 94,50 69,42" fill="#70D8EE"/>
  <polygon points="94,50 81,81 69,58" fill="#30B8CC"/>
  <polygon points="81,81 50,94 58,69" fill="#108098"/>
  <polygon points="50,94 19,81 42,69" fill="#0C5870"/>
  <polygon points="19,81 6,50 31,58" fill="#0E6880"/>
  <polygon points="6,50 19,19 31,42" fill="#2898B0"/>
  <polygon points="19,19 50,6 42,31" fill="#A0ECFF"/>
  <!-- Table circle -->
  <circle cx="50" cy="50" r="16" fill="#D0FAFF"/>
  <!-- Inner star facets on table -->
  <polygon points="50,34 54,50 50,66 46,50" fill="#A0F4FF" opacity="0.7"/>
  <polygon points="34,50 50,46 66,50 50,54" fill="#A0F4FF" opacity="0.7"/>
  <!-- Sparkle rays extending beyond girdle -->
  <line x1="50" y1="6" x2="50" y2="1" stroke="#90F0FF" stroke-width="1.5" opacity="0.8"/>
  <line x1="94" y1="50" x2="99" y2="50" stroke="#90F0FF" stroke-width="1.5" opacity="0.8"/>
  <line x1="50" y1="94" x2="50" y2="99" stroke="#90F0FF" stroke-width="1" opacity="0.6"/>
  <line x1="6" y1="50" x2="1" y2="50" stroke="#90F0FF" stroke-width="1" opacity="0.6"/>
  <line x1="19" y1="19" x2="15" y2="15" stroke="#C0F8FF" stroke-width="1.5" opacity="0.7"/>
  <line x1="81" y1="19" x2="85" y2="15" stroke="#C0F8FF" stroke-width="1.5" opacity="0.7"/>
  <line x1="81" y1="81" x2="85" y2="85" stroke="#C0F8FF" stroke-width="1" opacity="0.5"/>
  <line x1="19" y1="81" x2="15" y2="85" stroke="#C0F8FF" stroke-width="1" opacity="0.5"/>
  <!-- Center specular -->
  <ellipse cx="44" cy="44" rx="8" ry="5" fill="white" opacity="0.35"/>
</svg>
