<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Platinum: cushion cut (rounded square octagon) — 2 ring steps, 16 facets + inner star on table -->
  <!-- Step 1: outer octagon → mid octagon (8 facets) -->
  <polygon points="24,8 76,8 70,14 30,14" fill="#E8EEF6"/>
  <polygon points="76,8 92,24 82,26 70,14" fill="#C0CEDC"/>
  <polygon points="92,24 92,76 82,74 82,26" fill="#94A3B8"/>
  <polygon points="92,76 76,92 70,86 82,74" fill="#4A6070"/>
  <polygon points="76,92 24,92 30,86 70,86" fill="#283644"/>
  <polygon points="24,92 8,76 18,74 30,86" fill="#1C2C3C"/>
  <polygon points="8,76 8,24 18,26 18,74" fill="#607080"/>
  <polygon points="8,24 24,8 30,14 18,26" fill="#A8B8C8"/>
  <!-- Step 2: mid octagon → table (8 facets) -->
  <polygon points="30,14 70,14 62,22 38,22" fill="#D8E4F0"/>
  <polygon points="70,14 82,26 76,34 62,22" fill="#A0B0C0"/>
  <polygon points="82,26 82,74 76,66 76,34" fill="#7A8898"/>
  <polygon points="82,74 70,86 62,78 76,66" fill="#384858"/>
  <polygon points="70,86 30,86 38,78 62,78" fill="#1E2C38"/>
  <polygon points="30,86 18,74 24,66 38,78" fill="#141E28"/>
  <polygon points="18,74 18,26 24,34 24,66" fill="#4E6070"/>
  <polygon points="18,26 30,14 38,22 24,34" fill="#B0C0D0"/>
  <!-- Table octagon -->
  <polygon points="38,22 62,22 76,34 76,66 62,78 38,78 24,66 24,34" fill="#C8D8E8"/>
  <!-- Inner star on table (4-point) -->
  <polygon points="50,26 54,50 50,74 46,50" fill="#D8E8F4" opacity="0.9"/>
  <polygon points="26,50 50,46 74,50 50,54" fill="#D8E8F4" opacity="0.9"/>
  <!-- Center table highlight -->
  <circle cx="50" cy="50" r="7" fill="#EEF4FA"/>
  <ellipse cx="44" cy="36" rx="8" ry="5" fill="white" opacity="0.32"/>
</svg>
