<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Gold: square princess step cut — 2 rings of 4 facets + table -->
  <!-- Step 1: outer → mid ring -->
  <polygon points="8,8 92,8 80,20 20,20" fill="#F0D040"/>
  <polygon points="92,8 92,92 80,80 80,20" fill="#806010"/>
  <polygon points="92,92 8,92 20,80 80,80" fill="#504010"/>
  <polygon points="8,92 8,8 20,20 20,80" fill="#D4A820"/>
  <!-- Step 2: mid ring → table -->
  <polygon points="20,20 80,20 68,32 32,32" fill="#E8C838"/>
  <polygon points="80,20 80,80 68,68 68,32" fill="#906820"/>
  <polygon points="80,80 20,80 32,68 68,68" fill="#604808"/>
  <polygon points="20,80 20,20 32,32 32,68" fill="#C0A020"/>
  <!-- Table -->
  <rect x="32" y="32" width="36" height="36" fill="#FFE840"/>
  <!-- Specular -->
  <polygon points="32,32 52,32 44,42 32,44" fill="white" opacity="0.3"/>
</svg>
